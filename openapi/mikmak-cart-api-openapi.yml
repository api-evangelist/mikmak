components:
  schemas:
    CatalogProduct:
      type: object
      description: Product metadata returned with availability and cart responses (catalog fields; not store-specific).
      properties:
        id:
          type: string
          description: Product id (when applicable)
        ids:
          type: array
          description: Alternate product identifiers
          items:
            type: string
        gtin:
          type: string
          description: GTIN
        gtins:
          type: array
          description: List of GTINs
          items:
            type: string
            description: GTIN
        imageUrl:
          type: string
          description: Product image URL
        thumbnailImageUrl:
          type: string
          description: Product thumbnail image URL (optimized for small displays, 144px width)
        brand:
          type: string
          description: Brand
        title:
          type: string
          description: Title
        subtitle:
          type:
          - string
          - 'null'
          description: Subtitle
        description:
          type: string
          description: Product description (empty by default)
        packaging:
          type: string
          description: Containing or color
        review:
          type: object
          description: Review
          properties:
            count:
              type: number
              description: Count
            averageRating:
              type: number
              description: Rating
            roundedAverageRating:
              type: number
              description: Rounded rating
    CartAvailabilityLine:
      type: object
      description: Line item within a store cart (public `CartAvailability` shape)
      properties:
        productId:
          type: string
          description: Product identifier
        gtin:
          type: string
          description: GTIN
        quantity:
          type: integer
          description: Quantity in cart
        stockStatus:
          type: string
          description: Stock status for the line
        price:
          type: object
          description: Unit price
          properties:
            currency:
              type: string
              description: Currency
            value:
              type: number
              description: Value
            valueFormatted:
              type: string
              description: Display-formatted price string
            valueWithVoucher:
              type:
              - number
              - 'null'
              description: Unit price after voucher when applicable
        totalPrice:
          type: object
          description: Line total price
          properties:
            currency:
              type: string
              description: Currency
            value:
              type: number
              description: Value
            valueFormatted:
              type: string
              description: Display-formatted price string
            valueWithVoucher:
              type:
              - number
              - 'null'
              description: Line total after voucher when applicable
        voucher:
          allOf:
          - $ref: '#/components/schemas/Voucher'
        clickUrl:
          type: string
          description: Tracked click URL for this line
        doNotTrackClickUrl:
          type: string
          description: Click URL without tracking
        isTiedHouseLaw:
          type: boolean
          description: Whether tied house law applies to this line
    Voucher:
      type: object
      description: Promotional voucher that may apply to a line item
      properties:
        id:
          type: string
        versionId:
          type: string
        name:
          type: string
        code:
          type: string
        retailerId:
          type:
          - integer
          - 'null'
        online:
          type:
          - boolean
          - 'null'
        offline:
          type: boolean
        startDate:
          type:
          - string
          - 'null'
          format: date-time
        endDate:
          type:
          - string
          - 'null'
          format: date-time
        type:
          type: string
          description: Voucher type (configuration enum)
        text:
          type: string
        imageUrl:
          type: string
        description:
          type: string
        ctaText:
          type: string
        discountType:
          type:
          - string
          - 'null'
        discountPercent:
          type:
          - number
          - 'null'
          format: double
        discountAmount:
          type:
          - number
          - 'null'
          format: double
        url:
          type: string
        gtins:
          type: array
          items:
            type: string
        hasSecondStep:
          type: boolean
        secondStepUrl:
          type: string
        secondStepType:
          type:
          - string
          - 'null'
        formId:
          type:
          - string
          - 'null'
        locales:
          type: object
    CartResponse:
      type: object
      description: Public cart response (location, requested products, per-store carts, optional sessionId and alcoholSettings).
      properties:
        location:
          $ref: '#/components/schemas/Location'
        products:
          type: array
          description: Requested products (catalog metadata)
          items:
            $ref: '#/components/schemas/CatalogProduct'
        carts:
          type: array
          description: One entry per store with aggregated cart totals and per-line availability
          items:
            $ref: '#/components/schemas/CartStoreGroup'
        sessionId:
          type:
          - string
          - 'null'
          description: SessionID value
        alcoholSettings:
          type:
          - object
          - 'null'
          description: Alcohol settings configuration
          properties:
            tiedHouseLaw:
              type: integer
              description: Tied house law setting code
              example: 4
            showLocalRetailers:
              type: boolean
              description: Whether to show local retailers
              example: true
            showRetailerText:
              type: boolean
              description: Whether to show retailer text
              example: true
            settingCode:
              type: integer
              description: Alcohol setting code
              example: 3
            applyTiedHouseLaw:
              type: boolean
              description: Whether to apply tied house law
              example: true
            tiedHouseConditionMet:
              type: boolean
              description: Whether tied house condition is met (null if applyTiedHouseLaw is false)
              example: false
    Location:
      type: object
      description: Resolved or requested search location (shared across products, availabilities, and cart responses).
      properties:
        latitude:
          type: number
          description: Latitude
        longitude:
          type: number
          description: Longitude
        address:
          type:
          - string
          - 'null'
          description: Address
        city:
          type: string
          description: City
        country:
          type: string
          description: Country
        state:
          type: string
          description: State
        zipCode:
          type: string
          description: Zip code
        placeType:
          type:
          - string
          - 'null'
          description: Place type
        isMetricRegion:
          type: boolean
          description: Country is standard metric system (m) or not (miles)
    CartStoreGroup:
      type: object
      description: Store-level cart with aggregated totals and line items (public `Cart` shape)
      properties:
        store:
          type: object
          description: Store details (same general shape as store on each availability item in AvailabilitiesResponse)
          properties:
            retailer:
              type: object
              description: Retailer
              properties:
                id:
                  type: number
                  description: Id
                name:
                  type: string
                  description: Name
                logo:
                  type: object
                  description: Logo
                  properties:
                    isDefault:
                      type: boolean
                      description: Is the default logo
                    url:
                      type: string
                      description: URL
                    type:
                      type: string
                      description: rectangle or square
                logos:
                  type: array
                  description: Retailer logos (e.g. rectangle and square)
