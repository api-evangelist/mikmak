    CountryFilters:
      additionalProperties: false
      description: 'Filter by ISO 3166-1 alpha-2 country codes (e.g. ``US``, ``FR``).


        Full country names (e.g. ``France``) are rejected; use the 2-character code.'
      properties:
        includes:
          description: Include rows where the country dimension matches any of these 2-character ISO 3166-1 alpha-2 codes (e.g. 'FR', 'US'). Do not use full country names like 'France'.
          items:
            pattern: ^\w{2}$
            type: string
          title: Includes
          type: array
        excludes:
          description: Exclude rows where the country dimension matches any of these 2-character ISO 3166-1 alpha-2 codes (e.g. 'FR', 'US'). Do not use full country names like 'France'.
          items:
            pattern: ^\w{2}$
            type: string
          title: Excludes
          type: array
      title: CountryFilters
      type: object
