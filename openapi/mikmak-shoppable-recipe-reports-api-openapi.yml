      - retailerCTR
      - transactionValue
      - commerceLoadedRate
      - shoppableCommerceLoadedRate
      - visitorConversionRate
      - shoppableTransactionConversionRate
      - shoppableTransactionValueConversionRate
      - minAuraRoas
      - maxAuraRoas
      - auraAdSpend
      - auraIncrementalContribution
      title: Metrics
      description: 'Metrics available in custom reports (aggregated numeric values).


        Members:

        - purchaseIntentValue: Total financial value of Purchase Intent Clicks (price x clicks), in the selected currency.

        - averageClickPrice: Average listed price of clicked products (Purchase Intent Value / Total Purchase Intent Clicks).

        - purchaseIntentClicks: Total number of clicks-through to a retailer from a MikMak Commerce Experience (online + offline).

        - ctaView: Times the MikMak button was present on a page (or immediately before an auto-loaded Experience).

        - rawSalesAccountAmount: Transaction value attributed to Purchase Intent Clicks, restricted to products associated with the account.

        - rawSalesAmount: Transaction value attributed to Purchase Intent Clicks across all products (including other brands'').

        - commerceLoads: Number of times a MikMak Commerce Experience was fully initialized.

        - purchaseIntentRate: Percentage of shoppers who opened an Experience and then clicked through to a retailer.

        - ctaViewSessions: Unique user sessions containing at least one CTA View.

        - commerceLoadSessions: Unique user sessions containing at least one Commerce Load.

        - purchaseIntentClickSessions: Unique user sessions containing at least one Purchase Intent Click.

        - purchaseIntentRateSession: Purchase Intent Click Sessions divided by Commerce Load Sessions.

        - transactions: Number of attributable, unique orders within the retailer-defined attribution window.

        - skuSelected: Number of times a product was selected within a Commerce Experience.

        - onlinePurchaseIntentClicks: Purchase Intent Clicks targeting online stores (e.g., retailer PDPs).

        - offlinePurchaseIntentClicks: Purchase Intent Clicks targeting physical stores (e.g., store cards).

        - avgPriceLocalCurrency: Average product price in the product''s local currency (historical pricing).

        - minPriceLocalCurrency: Minimum product price in the product''s local currency (historical pricing).

        - maxPriceLocalCurrency: Maximum product price in the product''s local currency (historical pricing).

        - medianPriceLocalCurrency: Median product price in the product''s local currency (historical pricing).

        - inStock: Count of in-stock observations for the product at the retailer (historical pricing).

        - outOfStock: Count of out-of-stock observations for the product at the retailer (historical pricing).

        - retailerOpportunities: Count of retailer-display opportunities in the window.

        - missedRetailerOpportunities: Opportunities where no retailer was actually displayed.

        - retailerImpressions: Count of times a retailer was an option to checkout for a recipe.

        - retailerDisplayed: Times at least one store of a retailer was visible in an Experience (logo on-screen).

        - retailerInStock: Times at least one store of a retailer had stock available as a click-through option.

        - retailerOutOfStock: Times an eligible retailer had only out-of-stock stores in the Experience.

        - retailerInStockRate: retailerInStock / (retailerInStock + retailerOutOfStock).

        - retailerDisplayRate: retailerDisplayed / (retailerInStock + retailerOutOfStock).

        - retailerCTR: purchaseIntentClicks / retailerDisplayed (retailer click-through rate).

        - transactionValue: Attributed transaction value (shoppable recipes), in the selected currency.

        - commerceLoadedRate: Commerce-load rate for custom reports (ratio).

        - shoppableCommerceLoadedRate: Percentage of CTA Views that resulted in a Commerce Load (shoppable).

        - visitorConversionRate: purchaseIntentClicks / ctaView.

        - shoppableTransactionConversionRate: transactions / purchaseIntentClicks (shoppable).

        - shoppableTransactionValueConversionRate: transactionValue / purchaseIntentValue (shoppable).'
