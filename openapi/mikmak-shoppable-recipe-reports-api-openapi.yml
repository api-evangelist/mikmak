            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ReportFields:
      properties:
        dimensions:
          anyOf:
          - $ref: '#/components/schemas/ListConfig'
          - type: 'null'
        metrics:
          anyOf:
          - $ref: '#/components/schemas/ListConfig'
