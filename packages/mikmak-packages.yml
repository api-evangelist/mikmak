summary: >-
  MikMak publishes NO first-party client SDK for any of its APIs, in any language. Searches of
  npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist and crates.io returned no
  MikMak or Swaven API client. The @mikmak npm scope exists but holds only internal frontend
  tooling, last published in 2023; the Swaven GitHub organisation's 22 public repositories are
  build and infrastructure utilities, several explicitly marked DEPRECATED, with no API client
  among them. The only first-party distribution an integrator actually consumes is the
  brand.com where-to-buy tag, served unpinned from a CDN path keyed by the customer's own app id.
sdk_count: 0
official_sdk_count: 0
package_count: 4
packages:
  - name: mikmak-wtb-tag
    registry: cdn
    official: true
    kind: browser-tag
    url: https://wtb-tag.mikmak.ai/scripts/{appId}/tag.min.js
    version: null
    published: null
    note: >-
      Checked, nothing to record. The distribution is UNPINNED and per-customer - the path
      carries the brand's app id, not a version, and the loader always fetches whatever
      tag.min.js is current. There is no registry metadata endpoint, no jsDelivr/unpkg entry,
      and no integrity hash in the documented snippet. A consumer cannot tell which build they
      are running, and neither can we; the same is true for MikMak's own customers.
    docs: https://docs.mikmak.ai/docs/developer-guide
