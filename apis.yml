- aid: mikmak:mikmak-commerce-mcp
  name: MikMak Commerce MCP Server
  description: >-
    The MikMak Commerce MCP Server is a hosted Model Context Protocol surface in front of the Headless
    Commerce API (v1). It exposes three strictly-typed, read-only, non-destructive tools — search_products,
    search_availabilities and get_products — over the streamable-http transport, adding JSON-Schema argument
    validation, Auth0 JWT enforcement, per-key/per-IP/global rate limiting and request-id propagation
    so any MCP-compatible client can reason about products, retailers and availability without a bespoke
    REST integration.
  humanURL: https://docs.mikmak.ai/docs/developer-portal
  baseURL: https://mcp.mikmak.ai/commerce/v1
  tags:
  - MCP
  - agent-native
  - Commerce
  - Where to Buy
  - Product Availability
  - AI Agents
  - Tools
