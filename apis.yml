- aid: mikmak:mikmak-commerce
  name: MikMak Headless Commerce API
  description: 'The MikMak Headless Commerce API (v1) lets brands and their authorized agencies power
    commerce experiences on brand-owned websites and media ad units with MikMak''s retailer network: product
    lookup by GTIN/UPC/EAN, location-scoped retailer availability with price, stock and delivery mode,
    multi-product cart availability, online and local offers, product search with facets, and experience
    configuration. Use requires contractual approval; deployment on third-party sites is prohibited.'
