- aid: mikmak:mikmak-insights
  name: MikMak Insights API
  description: The MikMak Insights API is a reporting API that pushes MikMak commerce intelligence — Purchase
    Intent, Attributable Sales, historical pricing intelligence and shoppable-recipe performance — into
    data lakes, analytics platforms and BI tools such as Tableau, Power BI and Google Looker Studio. Callers
    authenticate against a single account, discover the available report fields and filters, then run
    or export custom reports.
