- aid: mikmak:mikmak-brand-com-tag
  name: MikMak Commerce for Brand.com (WTB Tag)
  description: The MikMak where-to-buy tag is the client-side distribution of MikMak Commerce for brand-owned
    websites. A single async script loaded from wtb-tag.mikmak.ai renders buy-now buttons, in-page containers
    and sticky widgets from HTML data attributes, driven by a window.swnDataLayer object, with a JavaScript
    callback surface and Google Tag Manager event and variable definitions for analytics.
  humanURL: https://docs.mikmak.ai/docs/developer-guide
  baseURL: https://wtb-tag.mikmak.ai
