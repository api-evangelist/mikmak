aid: mikmak
name: MikMak
description: MikMak is an eCommerce enablement and analytics platform for multichannel brands, converting
  shoppers across social media, retail media, brand-owned websites, search, CTV, display and QR codes.
  The platform pairs a Headless Commerce API — product lookup, retailer availability, offers, carts and
  experience configuration across a global retailer network — with the MikMak Insights reporting API that
  pushes purchase-intent and attributable-sales data into data lakes and BI tools, and a hosted Model
  Context Protocol server that exposes the same commerce surface to AI agents. MikMak acquired the French
  shoppable-media company Swaven in 2021, whose where-to-buy tag technology still powers the brand.com
  widget and whose name persists in the platform's asset hosts.
type: Index
accessModel:
  pricing: contact-sales
  onboarding: contract
  trial: false
  try_now: false
  public: false
  label: Contract Only
