summary: >-
  MikMak's own documentation states the crosswalk explicitly: "Every MCP tool call ultimately
  resolves to a REST request against the underlying Commerce API" and publishes a tool-to-path
  mapping table. That makes every binding here high-confidence and provider-asserted rather than
  inferred. The Commerce OpenAPI declares no operationId on any operation, so REST operations
  are addressed by method + path; the overlay at overlays/mikmak-commerce-api-overlay.yaml adds
  the operationIds used below as an API Evangelist enhancement, and they are flagged as such.
