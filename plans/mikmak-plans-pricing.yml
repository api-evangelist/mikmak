description: >-
  MikMak publishes no pricing. This file replaces a 2026-05-04 scaffold that invented a
  free/professional/enterprise ladder with fabricated quotas and rate limits; none of it existed
  on MikMak's site or in its documentation. There is no /pricing page (404 on both
  www.mikmak.com/pricing and /plans), no tier table, no published rate card, and no self-service
  signup anywhere on the developer surface. Access to the Headless Commerce API, the Insights
  API and the Commerce MCP Server is sold under contract - the Commerce API reference states
  outright that permitted uses "require explicit contractual approval and must be coordinated
  with MikMak's Commercial teams", and that an appropriate agreement or addendum must be
  executed before implementation. API keys, OAuth client credentials and the Auth0 audience are
  all issued by a MikMak representative during onboarding.
